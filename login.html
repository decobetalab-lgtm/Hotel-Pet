<!DOCTYPE html>
<!-- Página de entrada do sistema. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Hotel Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="tela-login">
    <img src="imagens/logo.svg" alt="Logo Hotel Pet" class="logo">
    <h1>Hotel Pet</h1>
    <p class="subtitulo">Faça login para gerenciar o hotel</p>

    <!-- Formulário de login -->
    <form action="index.html" method="get">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••">
      </div>

      <button type="submit" class="entrar">Entrar</button>
    </form>

    <div class="ajuda">
      <a href="usuario_cadastrar.html">Criar conta</a>
      <a href="login.html">Esqueci minha senha</a>
    </div>
  </main>
</body>
</html>
